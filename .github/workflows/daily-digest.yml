name: Daily Git Digest

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Daily Digest Generator
        run: |
          python .agents/skills/daily-git-digest/scripts/digest_generator.py \
            --repo-path "." \
            --output-dir "reports" \
            --update-release-notes

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ RELEASE_NOTES.md .digest_state.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: update daily git digest and release notes [skip ci]"
            git push
          fi
